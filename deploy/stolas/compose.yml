name: new-api-stolas

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  new-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: new-api:stolas-${DEPLOY_COMMIT:-local}
    restart: unless-stopped
    stop_grace_period: 180s
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.5
    cpu_shares: 2048
    pids_limit: 256
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - app_data:/data
      - app_logs:/app/logs
    environment:
      SQL_DSN: postgresql://new_api:${POSTGRES_PASSWORD:?Run deploy.sh first}@postgres:5432/new-api
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?Run deploy.sh first}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Run deploy.sh first}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?Run deploy.sh first}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: https://${DOMAIN:?Set DOMAIN in .env}
      FRONTEND_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.89.1}
      TZ: Asia/Shanghai
      DEFAULT_LANGUAGE: zh-CN
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "false"
      SHUTDOWN_TIMEOUT_SECONDS: "120"
      GOMEMLIMIT: 768MiB
      NODE_NAME: new-api-stolas-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:3000/api/status |
          grep -Eq '"success"[[:space:]]*:[[:space:]]*true'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - proxy
      - database
    logging: *logging

  postgres:
    image: postgres:15
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    environment:
      POSTGRES_USER: new_api
      POSTGRES_DB: new-api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy.sh first}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - database
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Run deploy.sh first}", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run deploy.sh first}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - database
    logging: *logging

volumes:
  app_data:
  app_logs:
  pg_data:

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.89.0/24
          gateway: 172.30.89.1
  database:
    internal: true
